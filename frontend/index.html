<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root{--sb:220px}
        body{background:#fafafa;font-family:system-ui,-apple-system,sans-serif}
        .sidebar{width:var(--sb);min-height:100vh;background:#111;position:fixed;left:0;top:0;z-index:100}
        .sidebar .brand{color:#fff;font-size:1.1rem;font-weight:700;padding:18px 16px;border-bottom:1px solid #333}
        .sidebar .nav-link{color:#aaa;padding:10px 16px;font-size:.9rem}
        .sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:#222}
        .sidebar .nav-link i{width:22px;margin-right:8px;text-align:center}
        .main{margin-left:var(--sb);padding:24px;min-height:100vh}
        .stat-card{border:1px solid #e0e0e0;border-radius:8px;background:#fff}
        .stat-card .val{font-size:1.8rem;font-weight:700}
        .stat-card .lbl{color:#888;font-size:.8rem}
        .badge-pending{background:#888;color:#fff}
        .badge-approved{background:#222;color:#fff}
        .badge-rejected{background:#666;color:#fff}
        .badge-closed{background:#bbb;color:#333}
        .badge-applied{background:#555;color:#fff}
        .badge-shortlisted{background:#333;color:#fff}
        .badge-selected{background:#000;color:#fff}
        .empty{text-align:center;padding:48px 20px;color:#999}
        .empty i{font-size:2.5rem;display:block;margin-bottom:12px}
        .login-box{max-width:400px;margin:80px auto}
        .table th{font-weight:600;font-size:.8rem;text-transform:uppercase;color:#888;border-bottom:2px solid #222}
        .btn-dark{background:#111;border-color:#111}
        .btn-dark:hover{background:#333;border-color:#333}
        .btn-outline-dark{border-color:#333;color:#333}
        .btn-outline-dark:hover{background:#111;color:#fff}
        @media(max-width:768px){
            .sidebar{display:none}
            .main{margin-left:0;padding:16px}
        }
    </style>
</head>
<body>
<div id="app"><router-view></router-view></div>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue-router@4.3.0/dist/vue-router.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
