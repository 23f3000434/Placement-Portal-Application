<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal</title>
    <!-- Bootstrap 5 CSS (mandatory framework) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --sidebar-width: 250px; }
        body { background: #f5f6fa; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            min-height: 100vh; background: #2c3e50; width: var(--sidebar-width);
            position: fixed; left: 0; top: 0; z-index: 100; transition: transform 0.3s;
        }
        .sidebar .nav-link { color: #ecf0f1; padding: 12px 20px; border-radius: 8px; margin: 4px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #34495e; color: #fff; }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; text-align: center; }
        .brand { color: #fff; font-size: 1.2rem; font-weight: 700; padding: 20px; border-bottom: 1px solid #34495e; }

        /* Content area */
        .content-area { margin-left: var(--sidebar-width); padding: 30px; min-height: 100vh; }

        /* Stat cards */
        .stat-card { border: none; border-radius: 12px; transition: transform 0.15s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-card .stat-label { color: #6c757d; font-size: 0.85rem; }

        /* Status badges */
        .badge-pending { background: #f39c12; }
        .badge-approved { background: #27ae60; }
        .badge-rejected { background: #e74c3c; }
        .badge-closed { background: #95a5a6; }
        .badge-applied { background: #3498db; }
        .badge-shortlisted { background: #f39c12; }
        .badge-selected { background: #27ae60; }

        /* Table */
        .table th { font-weight: 600; font-size: 0.85rem; text-transform: uppercase; color: #6c757d; }

        /* Login */
        .login-container { max-width: 450px; margin: 60px auto; }

        /* Empty state */
        .empty-state { text-align: center; padding: 60px 20px; color: #95a5a6; }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; display: block; }

        /* Mobile sidebar toggle */
        .sidebar-toggle { display: none; position: fixed; top: 10px; left: 10px; z-index: 200; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .content-area { margin-left: 0; padding: 15px; padding-top: 60px; }
            .sidebar-toggle { display: block; }
            .stat-card .stat-value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div id="app">
        <router-view></router-view>
    </div>

    <!-- Vue 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4.3.0/dist/vue-router.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js (optional/recommended) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

    <!-- App scripts -->
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/login.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/register.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/admin-dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/admin-companies.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/admin-drives.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/admin-students.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/admin-applications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/admin-stats.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/company-dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/company-drives.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/company-applications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/company-interviews.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/student-dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/student-drives.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/student-applications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/student-profile.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
