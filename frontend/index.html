<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6fa; }
        .sidebar { min-height: 100vh; background: #2c3e50; }
        .sidebar .nav-link { color: #ecf0f1; padding: 12px 20px; border-radius: 8px; margin: 4px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #34495e; color: #fff; }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; text-align: center; }
        .brand { color: #fff; font-size: 1.3rem; font-weight: 700; padding: 20px; border-bottom: 1px solid #34495e; }
        .stat-card { border: none; border-radius: 12px; transition: transform 0.15s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-card .stat-label { color: #6c757d; font-size: 0.9rem; }
        .badge-pending { background: #f39c12; }
        .badge-approved { background: #27ae60; }
        .badge-rejected { background: #e74c3c; }
        .badge-closed { background: #95a5a6; }
        .badge-applied { background: #3498db; }
        .badge-shortlisted { background: #f39c12; }
        .badge-selected { background: #27ae60; }
        .content-area { padding: 30px; }
        .table th { font-weight: 600; font-size: 0.85rem; text-transform: uppercase; color: #6c757d; }
        .login-container { max-width: 420px; margin: 80px auto; }
        .empty-state { text-align: center; padding: 60px 20px; color: #95a5a6; }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div id="app">
        <router-view></router-view>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4.3.0/dist/vue-router.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages/login.js"></script>
    <script src="js/pages/register.js"></script>
    <script src="js/pages/admin-dashboard.js"></script>
    <script src="js/pages/admin-companies.js"></script>
    <script src="js/pages/admin-drives.js"></script>
    <script src="js/pages/admin-students.js"></script>
    <script src="js/pages/admin-applications.js"></script>
    <script src="js/pages/company-dashboard.js"></script>
    <script src="js/pages/company-drives.js"></script>
    <script src="js/pages/company-applications.js"></script>
    <script src="js/pages/student-dashboard.js"></script>
    <script src="js/pages/student-drives.js"></script>
    <script src="js/pages/student-applications.js"></script>
    <script src="js/pages/student-profile.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
